name: Tests - Django + E2E (Playwright)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

# ═══════════════════════════════════════════════════════════════════════════════
# JOB 1: UNIT TESTS + INTEGRATION TESTS (Django TestCase + DRF APIClient)
# ═══════════════════════════════════════════════════════════════════════════════
jobs:
  django-tests:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: clinical_lens_db
          MYSQL_ROOT_HOST: '%'
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
        ports:
          - 3306:3306

    steps:
    - name: Checkout código
      uses: actions/checkout@v4

    - name: Configurar Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Crear archivo .env
      run: |
        cat > .env << 'EOF'
        SECRET_KEY=django-insecure-ci-test-key-not-for-production-1234567890
        DEBUG=False
        DB_NAME=clinical_lens_db
        DB_USER=root
        DB_PASSWORD=root
        DB_HOST=127.0.0.1
        DB_PORT=3306
        EMAIL_BACKEND=django.core.mail.backends.console.EmailBackend
        EMAIL_HOST=smtp.gmail.com
        EMAIL_PORT=587
        EMAIL_USE_TLS=True
        EMAIL_HOST_USER=noreply@test.com
        EMAIL_HOST_PASSWORD=test_password
        DEFAULT_FROM_EMAIL=ClinicalLens <noreply@test.com>
        EOF

    - name: Esperar a MySQL
      run: |
        for i in {1..30}; do
          mysqladmin ping -h 127.0.0.1 -u root -proot --silent && break
          echo "Esperando MySQL... intento $i"
          sleep 2
        done

    - name: Ejecutar migraciones
      run: python manage.py migrate --no-input

    - name: Ejecutar tests unitarios e integración
      run: python manage.py test --verbosity=2

    - name: Subir resultados de tests
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: django-test-results
        path: test_results/
        if-no-files-found: ignore

# ═══════════════════════════════════════════════════════════════════════════════
# JOB 2: E2E TESTS CON PLAYWRIGHT (live_server de pytest-django)
# ═══════════════════════════════════════════════════════════════════════════════
  e2e-tests:
    runs-on: ubuntu-latest
    needs: django-tests

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: clinical_lens_db
          MYSQL_ROOT_HOST: '%'
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
        ports:
          - 3306:3306

    steps:
    - name: Checkout código
      uses: actions/checkout@v4

    - name: Configurar Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Instalar dependencias Python
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Instalar Playwright y Chromium
      run: |
        playwright install chromium
        playwright install-deps chromium

    - name: Crear archivo .env
      run: |
        cat > .env << 'EOF'
        SECRET_KEY=django-insecure-ci-e2e-key-not-for-production-0987654321
        DEBUG=False
        DB_NAME=clinical_lens_db
        DB_USER=root
        DB_PASSWORD=root
        DB_HOST=127.0.0.1
        DB_PORT=3306
        EMAIL_BACKEND=django.core.mail.backends.console.EmailBackend
        EMAIL_HOST=smtp.gmail.com
        EMAIL_PORT=587
        EMAIL_USE_TLS=True
        EMAIL_HOST_USER=noreply@test.com
        EMAIL_HOST_PASSWORD=test_password
        DEFAULT_FROM_EMAIL=ClinicalLens <noreply@test.com>
        EOF

    - name: Esperar a MySQL
      run: |
        for i in {1..30}; do
          mysqladmin ping -h 127.0.0.1 -u root -proot --silent && break
          echo "Esperando MySQL... intento $i"
          sleep 2
        done

    - name: Ejecutar migraciones
      run: python manage.py migrate --no-input

    - name: Ejecutar tests E2E con Playwright
      run: |
        pytest tests/e2e/ -v \
          --screenshot=only-on-failure \
          --video=retain-on-failure \
          --html=playwright-report.html \
          --self-contained-html

    - name: Subir reporte Playwright
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: |
          playwright-report.html
          test-results/
        if-no-files-found: ignore

# ═══════════════════════════════════════════════════════════════════════════════
# JOB 3: COVERAGE REPORT
# ═══════════════════════════════════════════════════════════════════════════════
  coverage:
    runs-on: ubuntu-latest
    needs: django-tests

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: clinical_lens_db
          MYSQL_ROOT_HOST: '%'
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
        ports:
          - 3306:3306

    steps:
    - name: Checkout código
      uses: actions/checkout@v4

    - name: Configurar Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Crear archivo .env
      run: |
        cat > .env << 'EOF'
        SECRET_KEY=django-insecure-ci-cov-key-not-for-production-1122334455
        DEBUG=False
        DB_NAME=clinical_lens_db
        DB_USER=root
        DB_PASSWORD=root
        DB_HOST=127.0.0.1
        DB_PORT=3306
        EMAIL_BACKEND=django.core.mail.backends.console.EmailBackend
        EMAIL_HOST=smtp.gmail.com
        EMAIL_PORT=587
        EMAIL_USE_TLS=True
        EMAIL_HOST_USER=noreply@test.com
        EMAIL_HOST_PASSWORD=test_password
        DEFAULT_FROM_EMAIL=ClinicalLens <noreply@test.com>
        EOF

    - name: Esperar a MySQL
      run: |
        for i in {1..30}; do
          mysqladmin ping -h 127.0.0.1 -u root -proot --silent && break
          echo "Esperando MySQL... intento $i"
          sleep 2
        done

    - name: Ejecutar migraciones
      run: python manage.py migrate --no-input

    - name: Ejecutar tests con coverage
      run: |
        coverage run --source='prediccion,clinico,usuarios,alertas,reportes,pacientes' \
          manage.py test --verbosity=1
        coverage report --show-missing
        coverage xml -o coverage.xml
        coverage html -d htmlcov/

    - name: Subir reporte HTML de coverage
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-html
        path: htmlcov/
        if-no-files-found: ignore

    - name: Subir XML a Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        fail_ci_if_error: false
        token: ${{ secrets.CODECOV_TOKEN }}
